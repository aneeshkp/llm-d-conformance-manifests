---
# LLMInferenceService for tool-calling conformance
# Model: Qwen3-Coder-30B-A3B-Instruct-FP8 (MoE, 30B total / 3B active, FP8)
# Parser: qwen3_coder (native tool-call support)
# Requires: 1x GPU (80GB VRAM)
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: tool-calling
spec:
  model:
    uri: "hf://Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8"
    name: Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
  replicas: 1
  router:
    route: {}
    scheduler: {}
  template:
    imagePullSecrets:
    - name: rhai-pull-secret
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --enable-auto-tool-choice
              --tool-call-parser=hermes
              --enable-log-requests
              --enable-log-outputs
        resources:
          limits:
            nvidia.com/gpu: "1"
          requests:
            nvidia.com/gpu: "1"
