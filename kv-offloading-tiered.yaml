apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: kv-offloading-tiered
spec:
  model:
    uri: hf://Qwen/Qwen3-0.6B
    name: Qwen/Qwen3-0.6B
  replicas: 1
  router:
    scheduler:
      template:
        imagePullSecrets:
        - name: rhai-pull-secret
        containers:
        - name: main
    route: {}
    gateway: {}
  template:
    imagePullSecrets:
    - name: rhai-pull-secret
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          # sizeLimit should be set to 120% of CPU size + 1
          sizeLimit: 1Gi
    containers:
      - name: main
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
        env:
          # Shrink the on-GPU KV cache so modest traffic overflows to the CPU
          # tier and then spills to the filesystem tier (/mnt/kv-cache-0).
          - name: VLLM_ADDITIONAL_ARGS
            value: "--gpu-memory-utilization 0.2"
        resources:
          limits:
            cpu: '4'
            memory: 32Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: '2'
            memory: 16Gi
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
  workload:
    kvCacheOffloading:
      # Small CPU tier so it fills quickly and evicts to the filesystem tier.
      cpu: "512Mi"
      evictionPolicy: lru
      secondary:
        - fileSystem:
            emptyDir:
              size: "10Gi"
