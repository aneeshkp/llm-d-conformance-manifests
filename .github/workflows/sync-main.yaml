name: Sync EA branch from main

# Runs when a PR is merged to main. Keeps the EA branch in sync
# so that `--setup <version>-ea2` always has the latest manifests.
# To change the target EA branch, update EA_BRANCH below.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  EA_BRANCH: 3.6-ea2

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync EA branch from main
        run: |
          git fetch origin "$EA_BRANCH" || {
            echo "Branch $EA_BRANCH does not exist — creating from main"
            git push origin "main:refs/heads/$EA_BRANCH"
            exit 0
          }
          git checkout "$EA_BRANCH"
          if git merge --ff-only origin/main 2>/dev/null; then
            git push origin "$EA_BRANCH"
            echo "Synced $EA_BRANCH to main"
          else
            echo "WARNING: $EA_BRANCH has diverged from main — manual merge needed"
            exit 1
          fi
