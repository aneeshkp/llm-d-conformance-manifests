name: Sync GA branch from main

# Runs when a PR is merged to main. Keeps the GA branch in sync
# so that `--setup <version>-GA` always has the latest manifests.
# To change the target GA branch, update GA_BRANCH below.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GA_BRANCH: 3.5-GA

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync GA branch from main
        run: |
          git fetch origin "$GA_BRANCH" || {
            echo "Branch $GA_BRANCH does not exist — creating from main"
            git push origin "main:refs/heads/$GA_BRANCH"
            exit 0
          }
          git checkout "$GA_BRANCH"
          if git merge --ff-only origin/main 2>/dev/null; then
            git push origin "$GA_BRANCH"
            echo "Synced $GA_BRANCH to main"
          else
            echo "WARNING: $GA_BRANCH has diverged from main — manual merge needed"
            exit 1
          fi
